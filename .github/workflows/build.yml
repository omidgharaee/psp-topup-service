name: build

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop, release/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_XMLDOC_MODE: 'skip'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (Central Package Management)
        run: dotnet restore PSP.TopupService.sln

      - name: Build
        run: dotnet build PSP.TopupService.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Verify no warnings (treat-warnings-as-errors gate)
        run: dotnet build PSP.TopupService.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true /clp:ErrorsOnly

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: |
            **/bin/Release/**
            !**/bin/Release/**/*.pdb
          if-no-files-found: error
          retention-days: 7
