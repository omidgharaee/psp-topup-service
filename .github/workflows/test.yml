name: test

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop, release/*]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PSP.TopupService.sln

      - name: Build
        run: dotnet build PSP.TopupService.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        run: >
          dotnet test
          tests/PSP.TopupService.UnitTests/PSP.TopupService.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/unit
          -- RunConfiguration.CollectSourceInformation=true

      - name: Publish unit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests Results
          path: 'TestResults/unit/**/*.trx'
          reporter: dotnet-trx
          path-replace-backslashes: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.sha }}
          path: 'TestResults/unit/**/coverage.cobertura.xml'
          if-no-files-found: warn

  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PSP.TopupService.sln

      - name: Build
        run: dotnet build PSP.TopupService.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run architecture tests
        run: >
          dotnet test
          tests/PSP.TopupService.ArchitectureTests/PSP.TopupService.ArchitectureTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=arch-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults/arch

      - name: Publish architecture report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Architecture Tests Results
          path: 'TestResults/arch/**/*.trx'
          reporter: dotnet-trx
          path-replace-backslashes: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PSP.TopupService.sln

      - name: Build
        run: dotnet build PSP.TopupService.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run integration tests (Testcontainers)
        run: >
          dotnet test
          tests/PSP.TopupService.IntegrationTests/PSP.TopupService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/integration
          -- RunConfiguration.CollectSourceInformation=true

      - name: Publish integration report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests Results
          path: 'TestResults/integration/**/*.trx'
          reporter: dotnet-trx
          path-replace-backslashes: true
